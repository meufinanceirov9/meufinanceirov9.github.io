    realtimeChannel=null;
    clearInterval(cloudPollTimer); cloudPollTimer=null;
  }
  function startRealtimeSync(){
    const client=getCloudClient();
    if(!client || !cloudSession || !state?.settings?.cloud?.realtime) return;
    stopRealtimeSync();
    state.settings.cloud.cloudStatus = 'conectando';
    const uid = cloudSession.user.id;
    try{
      realtimeChannel = client.channel('financeiro-crm-live-'+uid)
        .on('postgres_changes', {event:'*', schema:'public', table:CLOUD_TABLE, filter:'user_id=eq.'+uid}, async (payload)=>{
          const remote = payload.new || {};
          const remoteData = remote.data || {};
          if(remoteData?.settings?.cloud?.originClientId === CLIENT_ID) return;
          const remoteTime = dateMs(remote.updated_at || remoteData.updatedAt);
          const localTime = dateMs(state.updatedAt);
          if(remoteTime > localTime + 500){
            state.settings.cloud.lastRealtimeAt = new Date().toISOString();
            cloudLog('Mudança detectada em outro aparelho. Puxando automaticamente...', 'info');
            await pullCloud(false);
            notify('Dados atualizados pela nuvem.', 'success');
            render();
          }
        })
        .subscribe((status)=>{
          state.settings.cloud.cloudStatus = status === 'SUBSCRIBED' ? 'online' : String(status||'conectando').toLowerCase();
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(_){ }
          renderCloudStatusOnly();
        });
    }catch(err){ console.warn('Realtime indisponível', err); }
    cloudPollTimer = setInterval(async()=>{
      if(cloudSyncing || !cloudSession || !state?.settings?.cloud?.autoSync) return;
      try{ await smartCloudSync(false); }catch(_){ }
    }, 8000);
  }
  function cloudLog(message, tone='info'){
    state.settings.cloud = state.settings.cloud || {};
    const entry = {at:new Date().toISOString(), message, tone};
    state.settings.cloud.lastMessage = message;
    state.settings.cloud.lastMessageTone = tone;
    state.settings.cloud.log = [entry, ...((state.settings.cloud.log||[]).slice(0,5))];
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(_){ }
    renderCloudStatusOnly();
  }
  function scheduleCloudSync(delay=650){
    if(!state?.settings?.cloud?.autoSync || !cloudSession || !cloudConfigured()) return;
    state.settings.cloud.pendingSync = true;
    state.settings.cloud.pendingChanges = safeNum(state.settings.cloud.pendingChanges) + 1;
    state.settings.cloud.lastLocalChangeAt = new Date().toISOString();

  function setupAutoSyncTriggers(){
    const run = ()=>{ if(cloudSession && state?.settings?.cloud?.autoSync) smartCloudSync(false); };

  async function ensureCloudSession(){

  async function getCloudRow(){
    const client=getCloudClient();
    if(!client || !cloudSession) return null;
    const {data,error} = await client.from(CLOUD_TABLE).select('data, updated_at').eq('user_id', cloudSession.user.id).maybeSingle();

  }
  function dateMs(v){ const t=Date.parse(v||''); return Number.isFinite(t)?t:0; }
  function mergeByIdOrKey(localArr, remoteArr, keyFn){
    const map = new Map();
    const add = (item)=>{
      if(!item) return;
      const key = keyFn(item) || item.id || JSON.stringify(item);
      const prev = map.get(key);
      if(!prev){ map.set(key, item); return; }
      const prevTime = dateMs(prev.updatedAt || prev.createdAt || prev.data);
      const nextTime = dateMs(item.updatedAt || item.createdAt || item.data);
      map.set(key, nextTime >= prevTime ? {...prev, ...item} : {...item, ...prev});
    };
    (localArr||[]).forEach(add);
    (remoteArr||[]).forEach(add);
    return Array.from(map.values());
  }

  function isSameCloudNamespace(data){ return data && data.settings && data.settings.appNamespace === APP_NAMESPACE; }
  function resetKeepingGoal(){

  function mergeFinancialStates(localRaw, remoteRaw){
    const local = migrateState(localRaw || {});
    const remote = migrateState(remoteRaw || {});
    const merged = deepClone(local);
    const localCloud = deepClone(local.settings?.cloud || {});
    const localProfile = deepClone(local.settings?.profile || {});
    merged.settings = {...local.settings, ...remote.settings, cloud:{...(remote.settings?.cloud||{}), ...localCloud}, profile:{...(remote.settings?.profile||{}), ...localProfile}};
    merged.patrimonio = mergeByIdOrKey(local.patrimonio, remote.patrimonio, p=>p.data ? 'pat:'+p.data : p.id).map(normalizePatrimonio);
    merged.lancamentos = mergeByIdOrKey(local.lancamentos, remote.lancamentos, l=>l.id).map(normalizeLancamento);
    merged.ifoodCash = mergeByIdOrKey(local.ifoodCash, remote.ifoodCash, x=>x.id || ['ifcash',x.data,x.recebido,x.troco,x.observacoes||''].join(':')).map(normalizeIfoodCash);
    merged.cartao = mergeByIdOrKey(local.cartao, remote.cartao, x=>x.id).map(normalizeCartao);
    merged.ifood = mergeByIdOrKey(local.ifood, remote.ifood, x=>x.id || ['ifood',x.weekStart,x.valor].join(':')).map(normalizeIfood);
    merged.combustivel = mergeByIdOrKey(local.combustivel, remote.combustivel, x=>x.id || ['fuel',x.data,x.valor,x.kmAtual].join(':')).map(normalizeCombustivel);
    merged.planejamento = mergeByIdOrKey(local.planejamento, remote.planejamento, x=>x.id || ['plan',x.data,x.descricao,x.valor].join(':'));
    merged.invoicePayments = mergeByIdOrKey(local.invoicePayments, remote.invoicePayments, x=>x.id || ['inv',x.data,x.valor].join(':'));
    merged.updatedAt = new Date(Math.max(dateMs(local.updatedAt), dateMs(remote.updatedAt), Date.now())).toISOString();
    merged.version = Math.max(safeNum(local.version), safeNum(remote.version), 4);
    return migrateState(merged);
  }

  async function pushCloud(show=true){
    const client=getCloudClient();
    if(!client) { if(show) notify('Configure a nuvem primeiro.', 'warn'); cloudLog('Nuvem não configurada.', 'warn'); return; }
    await ensureCloudSession();
    if(!cloudSession) { if(show) notify('Entre na sua conta para sincronizar.', 'warn'); cloudLog('Local na conta.', 'warn'); return; }
    if(cloudSyncing) return;
    cloudSyncing=true; cloudLog('Enviando dados deste aparelho para a nuvem...', 'info');
    try{
      const rowBefore = await getCloudRow().catch(()=>null);
      const clean = rowBefore?.data && isSameCloudNamespace(rowBefore.data) ? mergeFinancialStates(rowBefore.data, state) : migrateState(state);
      clean.updatedAt = new Date().toISOString();
      clean.settings.appNamespace = APP_NAMESPACE;
      clean.settings.cloud.lastPushAt = clean.updatedAt;
      clean.settings.cloud.originClientId = CLIENT_ID;
      clean.settings.cloud.ownerEmail = cloudSession?.user?.email || clean.settings.profile?.email || '';
      clean.settings.profile = {...(clean.settings.profile||{}), email: cloudSession?.user?.email || clean.settings.profile?.email || ''};
      const {error} = await client.from(CLOUD_TABLE).upsert({user_id:cloudSession.user.id, data:clean, updated_at:clean.updatedAt}, {onConflict:'user_id'});
      if(error) throw error;
      state = migrateState(clean);
      state.settings.cloud.lastSyncAt = clean.updatedAt;
      state.settings.cloud.lastPushAt = clean.updatedAt;
      state.settings.cloud.cloudUpdatedAt = clean.updatedAt;
      state.settings.cloud.originClientId = CLIENT_ID;
      state.settings.cloud.cloudStatus = 'online';
      state.settings.cloud.pendingSync = false;
      state.settings.cloud.pendingChanges = 0;
      state.settings.profile = {...(state.settings.profile||{}), email: cloudSession?.user?.email || state.settings.profile?.email || ''};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const msg=`Dados enviados e unidos com a nuvem. iFood dinheiro: ${(state.ifoodCash||[]).length} registro(s).`;
      cloudLog(msg, 'success');
      if(show) notify(msg, 'success');
    }catch(err){ console.error(err); const msg='Falha ao enviar para a nuvem. Confira login, tabela e regras do Supabase.'; cloudLog(msg, 'warn'); if(show) notify(msg, 'warn'); }
    finally{ cloudSyncing=false; renderCloudStatusOnly(); }
  }
  async function pullCloud(show=true){
    const client=getCloudClient();
    if(!client) { if(show) notify('Configure a nuvem primeiro.', 'warn'); cloudLog('Nuvem não configurada.', 'warn'); return; }
    await ensureCloudSession();
    if(!cloudSession) { if(show) notify('Entre na sua conta para buscar dados.', 'warn'); cloudLog('Local na conta.', 'warn'); return; }
    if(cloudSyncing) return;
    cloudSyncing=true; cloudLog('Buscando dados da nuvem...', 'info');
    try{
      const row = await getCloudRow();
      if(!row?.data){ const msg='Ainda não existe backup na nuvem para esta conta. Envie primeiro pelo aparelho que tem os dados corretos.'; cloudLog(msg, 'warn'); if(show) notify(msg, 'warn'); return; }
      if(!isSameCloudNamespace(row.data)){ const msg='A nuvem tem dados de uma versão antiga. A v12 começa limpa; use Sincronizar para gravar a base nova mantendo a meta.'; cloudLog(msg, 'warn'); if(show) notify(msg, 'warn'); return; }
      localStorage.setItem(`${STORAGE_KEY}-antes-puxar-nuvem-${Date.now()}`, JSON.stringify(state));
      const before = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
      state = mergeFinancialStates(before, row.data);
      state.settings.cloud = {...(state.settings.cloud||{}), ...(before.settings?.cloud||{})};
      state.settings.cloud.lastPullAt = new Date().toISOString();
      state.settings.cloud.lastSyncAt = state.settings.cloud.lastPullAt;
      state.settings.cloud.cloudUpdatedAt = row.updated_at || state.updatedAt || '';
      state.settings.cloud.cloudStatus = 'online';
      state.settings.cloud.pendingSync = false;
      state.settings.cloud.pendingChanges = 0;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const msg=`Dados da nuvem unidos com este aparelho. iFood dinheiro: ${(state.ifoodCash||[]).length} registro(s).`;
      cloudLog(msg, 'success');
      if(show) notify(msg, 'success');
      render();
    }catch(err){ console.error(err); const msg='Falha ao puxar dados da nuvem.'; cloudLog(msg, 'warn'); if(show) notify(msg, 'warn'); }
    finally{ cloudSyncing=false; renderCloudStatusOnly(); }
  }
  async function smartCloudSync(show=true){
    const client=getCloudClient();
    if(!client) { if(show) notify('Configure a nuvem primeiro.', 'warn'); cloudLog('Nuvem não configurada.', 'warn'); return; }
    await ensureCloudSession();
    if(!cloudSession) { if(show) notify('Entre na sua conta para sincronizar.', 'warn'); cloudLog('Local na conta.', 'warn'); return; }
    if(cloudSyncing) return;
    cloudSyncing=true;
    try{
      cloudLog('Sincronização automática em andamento...', 'info');
      const row = await getCloudRow();
      let merged;
      if(!row?.data || !isSameCloudNamespace(row.data)){
        merged = migrateState(state);
      }else{
        merged = mergeFinancialStates(state, row.data);
      }
      const ts = new Date().toISOString();
      merged.updatedAt = ts;
      merged.settings.cloud = {...(merged.settings.cloud||{}), ...(state.settings.cloud||{})};
      merged.settings.appNamespace = APP_NAMESPACE;
      merged.settings.cloud.lastSyncAt = ts;
      merged.settings.cloud.lastAutoSyncAt = ts;
      merged.settings.cloud.cloudUpdatedAt = ts;
      merged.settings.cloud.pendingSync = false;
      merged.settings.cloud.pendingChanges = 0;
      merged.settings.cloud.originClientId = CLIENT_ID;
      merged.settings.cloud.cloudStatus = 'online';
      merged.settings.cloud.ownerEmail = cloudSession?.user?.email || merged.settings.cloud.ownerEmail || '';
      merged.settings.profile = {...(merged.settings.profile||{}), email: cloudSession?.user?.email || merged.settings.profile?.email || ''};
      const {error} = await client.from(CLOUD_TABLE).upsert({user_id:cloudSession.user.id, data:merged, updated_at:ts}, {onConflict:'user_id'});
      if(error) throw error;
      state = migrateState(merged);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const msg = `Sincronizado automaticamente. iFood dinheiro: ${(state.ifoodCash||[]).length} registro(s).`;
      cloudLog(msg, 'success');
      if(show) notify(msg, 'success');
      render();
    }catch(err){ console.error(err); const msg='Sincronização automática falhou. Confira internet/login ou use backup local.'; cloudLog(msg, 'warn'); if(show) notify(msg, 'warn'); }
    finally{ cloudSyncing=false; renderCloudStatusOnly(); }
  }
  async function signOutCloud(){ const client=getCloudClient(); if(client) await client.auth.signOut(); cloudSession=null; stopRealtimeSync(); cloudLog('Você saiu da conta de nuvem.', 'success'); notify('Você saiu da nuvem.', 'success'); render(); }
  function renderCloudStatusOnly(){ const el=$('[data-cloud-status]'); if(el){ el.innerHTML = cloudStatusHtml(); } }

  function patrimonioBruto(p){ return safeNum(p?.futuro)+safeNum(p?.giro)+safeNum(p?.carteira)+safeNum(p?.banco)+safeNum(p?.investimentos); }
  function patrimonioLiquido(p){ return patrimonioBruto(p)-safeNum(p?.faturaAberta)-safeNum(p?.outrasDividas); }
  function latestPatrimonio(){ return sortByDateDesc(state.patrimonio)[0] || null; }
  function previousPatrimonio(){ return sortByDateDesc(state.patrimonio)[1] || null; }
  function incomeSources(){ return normalizeIncomeSources(state.settings.incomeSources); }
  function activeGoals(){ return normalizeGoals(state.settings.goals, state.settings.goal, state.settings.goalDue).filter(g=>g.active !== false); }
  function primaryGoal(){ return activeGoals()[0] || {name:'R$ 100 mil', target:100000, due:'2028-12-31'}; }
  function goalStats(goal,current){ const target=safeNum(goal.target); const falta=Math.max(0,target-current); const progresso=target>0?Math.min(100,Math.max(0,current/target*100)):0; const days=goal.due?daysBetween(todayISO(), goal.due):null; const months=days!==null?Math.max(1,Math.ceil(days/30.4375)):null; return {target,falta,progresso,days,months,monthly:months?falta/months:0}; }
  function isIncomeType(t){ return /receita|entrada|aporte|renda/i.test(t||'') && !/rendimento/i.test(t||''); }
  function isExpenseType(t){ return /saída|saida|despesa|gasto/i.test(t||''); }
  function isYieldType(t){ return /rendimento/i.test(t||''); }
  function isTransferType(t){ return /transfer/i.test(t||''); }
  function isInvoicePaymentType(t){ return /fatura/i.test(t||''); }
  function movimentosDoMes(m=currentMonth()){ return (state.lancamentos||[]).filter(l=>monthOf(l.data)===m); }
  function ifoodCashDoMes(m=currentMonth()){ return (state.ifoodCash||[]).filter(x=>monthOf(x.data)===m); }
  function stats(){
    const latest = latestPatrimonio(); const prev = previousPatrimonio(); const bruto = patrimonioBruto(latest); const liquido = patrimonioLiquido(latest); const goal = primaryGoal(); const gs = goalStats(goal, liquido); const m = currentMonth(); const movs = movimentosDoMes(m); const cash = ifoodCashDoMes(m);
    const receitas = movs.filter(x=>isIncomeType(x.tipo)).reduce((a,x)=>a+safeNum(x.valor),0);
    const rendGiroMov = movs.filter(x=>isYieldType(x.tipo) && /giro/i.test(x.conta)).reduce((a,x)=>a+safeNum(x.valor),0);
    const rendFuturoMov = movs.filter(x=>isYieldType(x.tipo) && /futuro|oficial/i.test(x.conta)).reduce((a,x)=>a+safeNum(x.valor),0);
    const saidas = movs.filter(x=>isExpenseType(x.tipo)).reduce((a,x)=>a+safeNum(x.valor),0);
    const ifoodCashNet = cash.reduce((a,x)=>a+safeNum(x.liquido),0);
    const explanation = explainDelta(latest, prev);
    return {latest,prev,bruto,liquido,goal,goalInfo:gs,receitas,rendGiroMov,rendFuturoMov,saidas,ifoodCashNet,explanation};
  }
  function explainDelta(latest, prev){
    if(!latest || !prev) return null;
    const start = normalizeDate(prev.data); const end = normalizeDate(latest.data);
    const movs = (state.lancamentos||[]).filter(l=>inClosedPatrimonioRange(l, prev, latest)); const cash = (state.ifoodCash||[]).filter(x=>inClosedPatrimonioRange(x, prev, latest));
    const income = movs.filter(x=>isIncomeType(x.tipo)).reduce((a,x)=>a+safeNum(x.valor),0);
    const expenses = movs.filter(x=>isExpenseType(x.tipo)).reduce((a,x)=>a+safeNum(x.valor),0);
    const ifoodNet = cash.reduce((a,x)=>a+safeNum(x.liquido),0);
    const activity = accountActivityBetween(prev, latest);
    const yieldGiroManual = safeNum(activity.manualYield.giro);
    const yieldFuturoManual = safeNum(activity.manualYield.futuro);
    const yieldGiroAuto = safeNum(activity.autoYield.giro);
    const yieldFuturoAuto = safeNum(activity.autoYield.futuro);
    const yieldGiro = yieldGiroManual + yieldGiroAuto;
    const yieldFuturo = yieldFuturoManual + yieldFuturoAuto;
    const caixinhaGap = safeNum(activity.accountGap.giro) + safeNum(activity.accountGap.futuro);
    const deltaLiquido = patrimonioLiquido(latest)-patrimonioLiquido(prev);
    const explained = income + yieldGiro + yieldFuturo + ifoodNet - expenses + caixinhaGap;
    return {deltaLiquido, income, yieldGiro, yieldFuturo, yieldGiroManual, yieldFuturoManual, yieldGiroAuto, yieldFuturoAuto, expenses, ifoodNet, caixinhaGap, explained, unexplained:deltaLiquido-explained, start, end};
  }
  function allMovements(limit=8){
    const lancs = (state.lancamentos||[]).map(l=>({kind:'mov',date:l.data,title:l.descricao||l.categoria||l.tipo,subtitle:`${l.tipo} • ${l.conta}${l.contaDestino?' → '+l.contaDestino:''}`,amount: isExpenseType(l.tipo) ? -safeNum(l.valor) : safeNum(l.valor), id:l.id}));
    const cash = (state.ifoodCash||[]).map(x=>({kind:'ifoodCash',date:x.data,title:'iFood dinheiro',subtitle:`Carteira +${asMoney(x.recebido)} • Giro -${asMoney(x.troco)}`,amount:safeNum(x.liquido),id:x.id}));
    const pats = (state.patrimonio||[]).map(p=>({kind:'pat',date:p.data,title:'Patrimônio diário',subtitle:`Líquido ${asMoney(patrimonioLiquido(p))}`,amount:patrimonioLiquido(p),id:p.id,neutral:true}));
    return [...lancs, ...cash, ...pats].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0, limit);
  }

  function accountKey(conta){
    const s = String(conta||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    if(s.includes('giro')) return 'giro';
    if(s.includes('futuro') || s.includes('oficial')) return 'futuro';
    if(s.includes('carteira') || s.includes('especie') || s.includes('dinheiro')) return 'carteira';
    if(s.includes('banco')) return 'banco';
    if(s.includes('invest')) return 'investimentos';
    return '';
  }
  function adjustAccount(obj, conta, delta){ const k=accountKey(conta); if(k) obj[k]=safeNum(obj[k])+safeNum(delta); }
  function isAfterSnapshot(item, snap){
    if(!item || !snap) return false;
    const di=normalizeDate(item.data), ds=normalizeDate(snap.data);
    if(di > ds) return true;
    if(di < ds) return false;
    const ti=Date.parse(item.createdAt || item.updatedAt || '');
    const ts=Date.parse(snap.updatedAt || snap.createdAt || '');
    return Number.isFinite(ti) && Number.isFinite(ts) && ti > ts;
  }
  function isLiveAfterSnapshot(item, snap){
    if(!item || !snap) return false;
    const di=normalizeDate(item.data), ds=normalizeDate(snap.data);
    if(di > ds) return true;
    if(di < ds) return false;
    // Mesma data precisa olhar o horário quando existir.
    // Isso mantém o iFood dinheiro entrando depois da base do dia, mas evita dobrar o valor
    // depois que o usuário confirma os saldos estimados como novo patrimônio de hoje.
    const ti=Date.parse(item.createdAt || item.updatedAt || '');
    const ts=Date.parse(snap.updatedAt || snap.createdAt || '');
    if(Number.isFinite(ti) && Number.isFinite(ts)) return ti > ts;
    if(!Number.isFinite(ts)) return true;
    return false;
  }

  function inDateRangeInclusiveEnd(item, start, end){
    const d = normalizeDate(item && item.data);
    return d > normalizeDate(start) && d <= normalizeDate(end);
  }
  function isOnOrBeforeSnapshot(item, snap){
    if(!item || !snap) return false;
    const di=normalizeDate(item.data), ds=normalizeDate(snap.data);
    if(di < ds) return true;
    if(di > ds) return false;
    const ti=Date.parse(item.createdAt || item.updatedAt || '');
    const ts=Date.parse(snap.updatedAt || snap.createdAt || '');
    // Se não houver horário confiável, mantemos compatibilidade e consideramos dentro do patrimônio do dia.
    if(!Number.isFinite(ti) || !Number.isFinite(ts)) return true;
    return ti <= ts;
  }
  function inClosedPatrimonioRange(item, prev, latest){
    if(!item || !prev || !latest) return false;
    const d=normalizeDate(item.data), start=normalizeDate(prev.data), end=normalizeDate(latest.data);
    return d > start && d <= end && isOnOrBeforeSnapshot(item, latest);
  }
  function pendingAfterLatest(){
    const latest=latestPatrimonio();
    if(!latest) return {cash:[], movements:[], totalCarteira:0,totalGiro:0,totalLiquido:0,totalCount:0};
    const cash=(state.ifoodCash||[]).filter(x=>isLiveAfterSnapshot(x, latest) && !isOnOrBeforeSnapshot(x, latest));
    const movements=(state.lancamentos||[]).filter(x=>isLiveAfterSnapshot(x, latest) && !isOnOrBeforeSnapshot(x, latest));
    const totalCarteira=cash.reduce((a,x)=>a+safeNum(x.recebido),0);
    const totalGiro=cash.reduce((a,x)=>a-safeNum(x.troco),0);
    const totalLiquido=totalCarteira+totalGiro;
    return {cash,movements,totalCarteira,totalGiro,totalLiquido,totalCount:cash.length+movements.length};
  }
  function emptyAccountBucket(){ return {giro:0,futuro:0,carteira:0,banco:0,investimentos:0}; }
  function addBucket(bucket, conta, delta){ const k=accountKey(conta); if(k) bucket[k]=safeNum(bucket[k])+safeNum(delta); }
  function accountActivityBetween(prev, latest){
    const start = normalizeDate(prev && prev.data), end = normalizeDate(latest && latest.data);
    const nonYield = emptyAccountBucket();
    const manualYield = {giro:safeNum(latest && latest.rendimentoGiro), futuro:safeNum(latest && latest.rendimentoFuturo)};
    const movements = (state.lancamentos||[]).filter(l=>inClosedPatrimonioRange(l, prev, latest));
    const cash = (state.ifoodCash||[]).filter(x=>inClosedPatrimonioRange(x, prev, latest));

    movements.forEach(l=>{
      const valor=safeNum(l.valor); if(!valor) return;
      if(isYieldType(l.tipo)){
        const k=accountKey(l.conta);
        if(k==='giro' || k==='futuro') manualYield[k]+=valor;
      } else if(isTransferType(l.tipo)){
        addBucket(nonYield, l.conta, -valor); addBucket(nonYield, l.contaDestino, valor);
      } else if(isInvoicePaymentType(l.tipo)){
        addBucket(nonYield, l.conta, -valor);
      } else if(isExpenseType(l.tipo)){
        addBucket(nonYield, l.conta, -valor);
      } else if(isIncomeType(l.tipo)){
        addBucket(nonYield, l.conta, valor);
      } else {
        addBucket(nonYield, l.conta, valor);
      }
    });
    cash.forEach(x=>{ nonYield.carteira += safeNum(x.recebido); nonYield.giro -= safeNum(x.troco); });

    const residual = {giro:0,futuro:0};
    ['giro','futuro'].forEach(k=>{
      const expected = safeNum(prev && prev[k]) + safeNum(nonYield[k]) + safeNum(manualYield[k]);
      residual[k] = safeNum(latest && latest[k]) - expected;
      if(Math.abs(residual[k]) < 0.005) residual[k]=0;
    });
    const autoYield = {giro:Math.max(0,residual.giro), futuro:Math.max(0,residual.futuro)};
    const accountGap = {giro:Math.min(0,residual.giro), futuro:Math.min(0,residual.futuro)};
    return {nonYield, manualYield, residual, autoYield, accountGap, start, end};
  }
  function patrimonioPairs(){
    const arr = (state.patrimonio||[]).slice().sort((a,b)=>String(a.data).localeCompare(String(b.data)) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    const pairs=[]; for(let i=1;i<arr.length;i++) pairs.push([arr[i-1], arr[i]]); return pairs;
  }
  function estimatedBalances(){
    const latest = latestPatrimonio();
    if(!latest) return {available:false, changes:[]};
    const est = {...latest};
    const changes=[];
    (state.lancamentos||[]).filter(l=>isLiveAfterSnapshot(l, latest)).forEach(l=>{
      const valor=safeNum(l.valor); if(!valor) return;
      if(isTransferType(l.tipo)){
        adjustAccount(est, l.conta, -valor); adjustAccount(est, l.contaDestino, valor);
        changes.push({label:`Transferência ${l.conta||''} → ${l.contaDestino||''}`, value:0});
      } else if(isInvoicePaymentType(l.tipo)){
        adjustAccount(est, l.conta, -valor); est.faturaAberta=Math.max(0, safeNum(est.faturaAberta)-valor);
        changes.push({label:'Pagamento de fatura', value:0});
      } else if(isExpenseType(l.tipo)){
        adjustAccount(est, l.conta, -valor); changes.push({label:l.descricao||'Saída registrada', value:-valor});
      } else {
        adjustAccount(est, l.conta, valor); changes.push({label:l.descricao||l.tipo||'Entrada registrada', value:valor});
      }
    });
    (state.ifoodCash||[]).filter(x=>isLiveAfterSnapshot(x, latest)).forEach(x=>{
      const recebido=safeNum(x.recebido), troco=safeNum(x.troco), liquido=recebido-troco;
      est.carteira=safeNum(est.carteira)+recebido;
      est.giro=safeNum(est.giro)-troco;
      changes.push({label:'iFood dinheiro: carteira recebeu espécie e Giro deu troco', value:liquido});
    });
    return {available:true, base:latest, est, changes, bruto:patrimonioBruto(est), liquido:patrimonioLiquido(est)};
  }

    const dups = duplicateCount(state.lancamentos)+duplicateCount(state.ifoodCash)+duplicateCount(state.patrimonio)+duplicateCount(state.cartao);
    const ifoodAfterBase = latest ? (state.ifoodCash||[]).filter(x=>isLiveAfterSnapshot(x, latest)).length : 0;

  function daysUntilDayOfMonth(day){
    const now=new Date();
    const target=new Date(now.getFullYear(), now.getMonth(), Number(day));
    target.setHours(9,0,0,0);
    if(target < now) target.setMonth(target.getMonth()+1);
    return Math.max(0, Math.ceil((target-now)/(1000*60*60*24)));
  }

  function cdiStats(){
    const entries = [];
    (state.patrimonio||[]).forEach(p=>{
      const giro=safeNum(p.rendimentoGiro), futuro=safeNum(p.rendimentoFuturo);
      if(giro || futuro) entries.push({data:p.data, origem:'Informado no patrimônio diário', modo:'manual', giro, futuro, total:giro+futuro});
    });
    (state.lancamentos||[]).filter(l=>isYieldType(l.tipo)).forEach(l=>{
      const valor=safeNum(l.valor); const giro=/giro/i.test(l.conta); const futuro=/futuro|oficial/i.test(l.conta);
      entries.push({data:l.data, origem:l.descricao||sourceName(l.sourceId)||'Lançamento de rendimento', modo:'manual', giro:giro?valor:0, futuro:futuro?valor:0, total:valor});
    });
    patrimonioPairs().forEach(([prev,latest])=>{
      const a = accountActivityBetween(prev, latest);
      const giro=safeNum(a.autoYield.giro), futuro=safeNum(a.autoYield.futuro);
      if(giro || futuro) entries.push({data:latest.data, origem:`Calculado pela diferença (${formatDate(prev.data)} → ${formatDate(latest.data)})`, modo:'auto', giro, futuro, total:giro+futuro});
    });
    entries.sort((a,b)=>String(b.data).localeCompare(String(a.data)) || String(b.modo||'').localeCompare(String(a.modo||'')));
    const mes=currentMonth(); const mesAtual=entries.filter(x=>monthOf(x.data)===mes);
    const sum=(arr,k)=>arr.reduce((a,x)=>a+safeNum(x[k]),0);
    const autoMes=mesAtual.filter(x=>x.modo==='auto');
    return {entries, mesAtual, giroMes:sum(mesAtual,'giro'), futuroMes:sum(mesAtual,'futuro'), totalMes:sum(mesAtual,'total'), autoMes:sum(autoMes,'total'), totalGeral:sum(entries,'total'), ultimo:entries[0]||null};
  }

  function trailForAccount(account){
    const latest=latestPatrimonio(); const rows=[]; let saldo=safeNum(latest && latest[account]);
    if(latest){ rows.push({data:latest.data, label:'Saldo conferido no patrimônio diário', delta:null, saldo, kind:'base'}); }
    const items=[];
    const after = item => latest ? isLiveAfterSnapshot(item, latest) : true;
    (state.lancamentos||[]).filter(after).forEach(l=>{
      const valor=safeNum(l.valor); if(!valor) return;
      const from=accountKey(l.conta), to=accountKey(l.contaDestino);
      const label=l.descricao || l.categoria || l.tipo || 'Lançamento';
      if(isTransferType(l.tipo)){
        if(from===account) items.push({data:l.data, createdAt:l.createdAt, label:`Transferência enviada: ${label}`, delta:-valor});
        if(to===account) items.push({data:l.data, createdAt:l.createdAt, label:`Transferência recebida: ${label}`, delta:valor});
      } else if(isInvoicePaymentType(l.tipo) || isExpenseType(l.tipo)){
        if(from===account) items.push({data:l.data, createdAt:l.createdAt, label, delta:-valor});
      } else {
        if(from===account) items.push({data:l.data, createdAt:l.createdAt, label, delta:valor});
      }
    });
    (state.ifoodCash||[]).filter(after).forEach(x=>{
      if(account==='carteira' && safeNum(x.recebido)) items.push({data:x.data, createdAt:x.createdAt, label:'iFood dinheiro: espécie recebida do cliente', delta:safeNum(x.recebido)});

    });
    items.sort((a,b)=>String(a.data).localeCompare(String(b.data)) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    items.forEach(it=>{ saldo += safeNum(it.delta); rows.push({...it, saldo}); });
    return rows;
  }
  function accountTitle(account){ return ({futuro:'Caixinha Futuro',giro:'Caixinha Giro',carteira:'Dinheiro em espécie',banco:'Banco / conta corrente',investimentos:'Investimentos / outros'}[account] || 'Conta'); }

  function consistencyChecks(){
    const latest = latestPatrimonio();
    const est = estimatedBalances();
    const checks=[];
    if(!latest){
      checks.push({tone:'warn', icon:'!', title:'Patrimônio ainda sem base', text:'Registre o primeiro patrimônio para o app calcular saldos vivos e rendimentos.'});
      return checks;
    }
    const lastDate = normalizeDate(latest.data);
    if(lastDate !== todayISO()) checks.push({tone:'info', icon:'↻', title:'Conferência do dia', text:`Último patrimônio: ${formatDate(lastDate)}. Os saldos abaixo são estimados pelos movimentos depois disso.`});
    else checks.push({tone:'good', icon:'✓', title:'Base de hoje registrada', text:'O patrimônio do dia já tem uma base para comparação.'});

    const afterCash = (state.ifoodCash||[]).filter(x=>isLiveAfterSnapshot(x, latest));
    const rec = afterCash.reduce((a,x)=>a+safeNum(x.recebido),0);
    const troco = afterCash.reduce((a,x)=>a+safeNum(x.troco),0);
    if(rec || troco){
      checks.push({tone:'good', icon:'💵', title:'iFood dinheiro rastreado', text:`Carteira +${asMoney(rec)} e Giro -${asMoney(troco)} desde a última base.`});
    }

    const c = cdiStats();
    const auto = safeNum(c.autoMes);
    checks.push({tone:auto>=0?'good':'warn', icon:'📈', title:'Rendimentos separados', text:`CDI mês: ${asMoney(c.totalMes)}. Giro ${asMoney(c.giroMes)} • Futuro ${asMoney(c.futuroMes)}.`});

    const pending = pendingAfterLatest();
    const ex = stats().explanation;
    if(pending.totalCount){
      checks.push({tone:'info', icon:'↳', title:'Movimento pós-base', text:`Há ${asMoney(pending.totalLiquido)} depois do último patrimônio: Carteira ${asMoney(pending.totalCarteira)} e Giro ${asMoney(pending.totalGiro)}. Isso está rastreado; falta só confirmar no próximo patrimônio.`});
    } else if(ex){
      const ok = Math.abs(ex.unexplained) < .03;
      checks.push({tone:ok?'good':'warn', icon:ok?'✓':'?', title:ok?'Patrimônio conciliado':'Diferença a explicar', text:ok?'A variação entre os dois últimos patrimônios está fechada.':`Ainda falta explicar ${asMoney(ex.unexplained)}.`});
    }

    const sameDateLive = latest ? (state.ifoodCash||[]).filter(x=>normalizeDate(x.data)===normalizeDate(latest.data) && isLiveAfterSnapshot(x, latest)).length + (state.lancamentos||[]).filter(x=>normalizeDate(x.data)===normalizeDate(latest.data) && isLiveAfterSnapshot(x, latest)).length : 0;
    if(sameDateLive && latest?.createdAt){ checks.push({tone:'info', icon:'⏱️', title:'Movimentos depois da base', text:`${sameDateLive} registro(s) do mesmo dia estão depois do patrimônio salvo e entram só no saldo estimado.`}); }

    const lastBackup = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
    const age = lastBackup ? Math.floor((Date.now()-lastBackup.getTime())/86400000) : 9999;
    checks.push({tone:age<=safeNum(state.settings.backupReminderDays||7)?'good':'warn', icon:'☁️', title:'Backup', text:lastBackup?`Último backup há ${age} dia(s).`:'Backup ainda não registrado neste aparelho.'});
    return checks;
  }

  function openConsistencyPanel(){
    const latest = latestPatrimonio(); const est = estimatedBalances(); const checks = consistencyChecks(); const rows = latest && est.available ? [
      ['Caixinha Futuro', latest.futuro, est.est.futuro, est.est.futuro-latest.futuro],
      ['Caixinha Giro', latest.giro, est.est.giro, est.est.giro-latest.giro],
      ['Dinheiro em espécie', latest.carteira, est.est.carteira, est.est.carteira-latest.carteira],
      ['Banco', latest.banco, est.est.banco, est.est.banco-latest.banco],
      ['Investimentos/outros', latest.investimentos, est.est.investimentos, est.est.investimentos-latest.investimentos],
      ['Fatura aberta', latest.faturaAberta, est.est.faturaAberta, est.est.faturaAberta-latest.faturaAberta],
    ] : [];
    openModal(`<div class="card-title"><div><h2>Diagnóstico de consistência</h2><p>Mostra o que o app está usando para chegar nos saldos atuais. Se algo não bater, registre o movimento correto ou faça um novo patrimônio diário.</p></div><span class="pill">${APP_VERSION}</span></div><div class="health-grid">${checks.map(c=>`<div class="health-card ${c.tone}"><span class="status">${escapeHtml(c.icon)}</span><b>${escapeHtml(c.title)}</b><span>${escapeHtml(c.text)}</span></div>`).join('')}</div>${rows.length?`<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Conta</th><th>Última base</th><th>Saldo estimado</th><th>Movimentos depois</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(r[0])}</td><td class="sensitive">${privateMoney(r[1])}</td><td class="sensitive"><b>${privateMoney(r[2])}</b></td><td class="sensitive ${r[3]<0?'neg':r[3]>0?'pos':'neu'}">${privateMoney(r[3])}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Registre patrimônio para liberar o diagnóstico de saldos.</div>'}<div class="kpi-strip" style="margin-top:14px"><button class="primary-btn" data-action="saveEstimatedAsPatrimonio">Confirmar estimado como patrimônio</button><button class="ghost-btn" data-action="quickPatrimonio">Conferir manualmente</button><button class="ghost-btn" data-action="quickIfoodCash">iFood dinheiro</button><button class="ghost-btn" data-action="quickDeposit">Entrada</button><button class="ghost-btn" data-action="quickExpense">Saída</button><button class="ghost-btn" data-action="openCdiPanel">Rendimentos</button></div>`);
  }

  function renderTodayCenter(s){ return `<section class="card"><div class="card-title"><div><h2>Central do dia</h2><p>Registre o movimento certo sem precisar pensar em contabilidade.</p></div><span class="pill">${formatDate(todayISO())}</span></div><div class="quick-grid">

    <button class="quick-card" data-action="quickIfoodCash"><span class="quick-ico">🛵</span><b>iFood dinheiro</b><span>Espécie entra na Carteira; troco sai do Giro.</span></button>

    <button class="quick-card" data-action="quickYieldGiro"><span class="quick-ico">📈</span><b>Rendimento Giro</b><span>Registrar CDI da Caixinha Giro sem virar faturamento.</span></button>
    <button class="quick-card" data-action="quickYieldFuturo"><span class="quick-ico">🌱</span><b>Rendimento Futuro</b><span>Registrar rendimento do Futuro/Oficial separado da renda.</span></button>
  </div></section>`; }
  function renderExplain(s){ const e=s.explanation; if(!e) return `<section class="card"><h2>Por que o patrimônio mudou?</h2><p class="help">Registre pelo menos dois dias de patrimônio para o app comparar a mudança e mostrar o que foi entrada, rendimento, iFood dinheiro ou saída.</p></section>`; const ok = Math.abs(e.unexplained) < .03; const hasAuto=(e.yieldGiroAuto||e.yieldFuturoAuto); const hasGap=Math.abs(e.caixinhaGap||0)>.004; return `<section class="card"><div class="card-title"><div><h2>Por que o patrimônio mudou?</h2><p>Comparação de ${formatDate(e.start)} até ${formatDate(e.end)}. Movimentos lançados depois do último patrimônio ficam como saldo estimado, não como diferença sem explicação.</p></div><span class="pill ${ok?'green':''}">${ok?'Fechado':'A conferir'}</span></div>
    ${explainLine('Variação líquida do patrimônio', e.deltaLiquido)}${explainLine('Entradas / aportes / renda extra', e.income)}${explainLine('Rendimento Futuro', e.yieldFuturo)}${explainLine('Rendimento Giro', e.yieldGiro)}${hasAuto?explainLine('CDI calculado automaticamente', e.yieldGiroAuto+e.yieldFuturoAuto):''}${explainLine('iFood dinheiro líquido', e.ifoodNet)}${explainLine('Saídas/despesas registradas', -e.expenses)}${hasGap?explainLine('Caixinha a conferir', e.caixinhaGap, true):''}${explainLine('Diferença ainda sem explicação', e.unexplained, true)}
    <p class="help">Agora o app tenta calcular o rendimento das caixinhas sozinho: saldo atual − saldo anterior − aportes/saídas/trocos já registrados. Se sobrar positivo, vira CDI automático; se sobrar negativo, aparece como caixinha a conferir.</p></section>`; }
  function explainLine(label, value, strong=false){ const cls=value<0?'neg':value>0?'pos':'neu'; return `<div class="explain-line"><span>${escapeHtml(label)}</span><b class="${cls} sensitive">${strong?'': ''}${privateMoney(value)}</b></div>`; }
  function renderHistoryEditReview(){
    const editedLancs=(state.lancamentos||[]).filter(x=>x.editedAt || (x.editHistory||[]).length);
    const editedIfood=(state.ifoodCash||[]).filter(x=>x.editedAt || (x.editHistory||[]).length);
    const total=editedLancs.length+editedIfood.length;

  }
  function renderRecent(){ const items = allMovements(10); return `<section class="card"><div class="card-title"><div><h2>Últimos registros</h2><p>Extrato rápido para entender o dia. Lançamentos e iFood dinheiro agora podem ser editados diretamente pelo histórico.</p></div><div class="kpi-strip"><button class="ghost-btn" data-action="undoLastMovement">Desfazer último</button><button class="ghost-btn" data-view="lancamentos">Editar histórico</button><button class="ghost-btn" data-view="relatorios">Relatórios</button></div></div>${items.length?`<div class="list">${items.map(item=>`<div class="list-item"><div><strong>${escapeHtml(item.title)}</strong><span>${formatDate(item.date)} • ${escapeHtml(item.subtitle)}</span></div><div class="list-actions"><div class="list-amount ${item.neutral?'neu':item.amount<0?'neg':'pos'} sensitive">${item.neutral ? privateMoney(item.amount) : privateMoney(item.amount)}</div>${item.kind==='mov'?`<button class="mini-btn" data-action="openEditLancamento" data-id="${escapeHtml(item.id)}">Editar</button>`:item.kind==='ifoodCash'?`<button class="mini-btn" data-action="openEditIfoodCash" data-id="${escapeHtml(item.id)}">Editar</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty">Sem registros ainda.</div>'}</section>`; }

  function patrimonioList(){ const arr=sortByDateDesc(state.patrimonio).slice(0,12); return `<section class="card"><h2>Histórico de patrimônio</h2>${arr.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Futuro</th><th>Bruto</th><th>Líquido c/ cartão</th><th>Giro</th><th>Carteira</th><th>Rendimentos</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${formatDate(p.data)}</td><td class="sensitive">${privateMoney(p.futuro)}</td><td class="sensitive">${privateMoney(patrimonioBruto(p))}</td><td class="sensitive"><b>${privateMoney(patrimonioLiquido(p))}</b></td><td class="sensitive">${privateMoney(p.giro)}</td><td class="sensitive">${privateMoney(p.carteira)}</td><td>${privateMoney(safeNum(p.rendimentoFuturo)+safeNum(p.rendimentoGiro))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum patrimônio registrado.</div>'}</section>`; }

  function renderEntradas(){ const recent=recentIncomeDeposits(12); const est=estimatedBalances(); const p=est.available?est.est:(latestPatrimonio()||{}); return `<section class="card"><div class="card-title"><div><p class="eyebrow">Base do dia</p><h2>Patrimônio diário</h2><p>Antes ou depois dos lançamentos, você pode registrar os saldos reais de Futuro, Giro, Carteira e cartão.</p></div><button class="primary-btn" data-action="quickPatrimonio">Registrar patrimônio</button></div></section><section class="card"><div class="card-title"><div><h2>Entradas e depósitos</h2><p>Registre o dinheiro novo e escolha o destino. Ex.: salário CLT → Caixinha Futuro, Pix extra → Giro, dinheiro físico → Carteira.</p></div><span class="pill green">Consistência</span></div>${depositForm()}<p class="help" style="margin-top:12px"><b>Regra do app:</b> entrada/aporte/renda extra aumenta a conta escolhida e explica a variação do patrimônio. Não entra como rendimento CDI.</p></section><section class="card"><div class="card-title"><div><h2>Saldos depois das entradas</h2><p>Esses valores usam o último patrimônio + movimentos registrados depois dele.</p></div><button class="ghost-btn" data-action="openConsistencyPanel">Diagnóstico</button>${isDevMode()?'<button class="ghost-btn" data-action="openAuditPanel">Auditoria</button>':''}</div><div class="grid grid-4"><div class="metric"><span class="metric-label">Giro</span><span class="metric-value sensitive">${privateMoney(p.giro)}</span></div><div class="metric"><span class="metric-label">Futuro</span><span class="metric-value sensitive">${privateMoney(p.futuro)}</span></div><div class="metric"><span class="metric-label">Carteira</span><span class="metric-value sensitive">${privateMoney(p.carteira)}</span></div><div class="metric"><span class="metric-label">Banco</span><span class="metric-value sensitive">${privateMoney(p.banco)}</span></div></div></section><section class="card"><div class="card-title"><div><h2>Histórico de entradas</h2><p>Renda principal, extras, entregas e barman em um lugar só.</p></div></div>${recent.length?`<div class="list">${recent.map(l=>`<div class="list-item"><div><strong>${escapeHtml(sourceName(l.sourceId)||l.categoria||'Entrada')}</strong><span>${formatDate(l.data)} • ${escapeHtml(l.descricao||'Sem descrição')} • destino: ${escapeHtml(l.conta)}</span></div><div class="list-amount pos sensitive">${privateMoney(l.valor)}</div></div>`).join('')}</div>`:'<div class="empty">Sem entradas registradas ainda.</div>'}</section>`; }

  function switchEcosystem(mode){
    if(mode === 'developer' && !isAdminAccount()) return notify('Modo desenvolvedor é exclusivo da conta administradora.', 'warn');

    state.settings.uiMode = mode === 'developer' ? 'developer' : 'user';
    state.currentView = mode === 'developer' ? (state.settings.developerLastView || 'dashboard') : (state.settings.userLastView || 'dashboard');
    if(!viewExists(state.currentView)) state.currentView = 'dashboard';
    saveState(); closeModal(); renderNav(); render();
    notify(mode === 'developer' ? 'Modo desenvolvedor aberto.' : 'Visualização de usuário aberta.', mode === 'developer' ? 'warn' : 'success');
  }

  function saveCloudConfig(form){
    const f=formObj(form);
    state.settings.cloud = {...(state.settings.cloud||{}), enabled:true, url:(f.url||'').trim().replace(/\/rest\/v1\/?$/,''), anonKey:(f.anonKey||'').trim(), autoSync:f.autoSync !== 'false', realtime:f.realtime !== 'false'};
    supabaseClient=null;
    saveState(false);
    initCloud();
    cloudLog('Configuração salva. Local com e-mail e senha.', 'success');
    notify('Configuração salva. Local com e-mail e senha.', 'success');
    render();
  }
  async function signInWithEmail(form){
    const f=formObj(form); const client=getCloudClient();
    if(!client) return notify('Salve a configuração do Supabase primeiro.', 'warn');
    if(!f.email || !f.password) return notify('Informe e-mail e senha.', 'warn');
    try{
      const res = f.mode==='signup' ? await client.auth.signUp({email:f.email, password:f.password}) : await client.auth.signInWithPassword({email:f.email, password:f.password});
      if(res.error) throw res.error;
      cloudSession = res.data?.session || cloudSession;
      if(!cloudSession && f.mode==='signup'){
        cloudLog('Conta criada. Confirme o e-mail se o Supabase pedir; depois faça login.', 'success');
        notify('Conta criada. Confirme o e-mail se o Supabase pedir; depois volte e faça login.', 'success');
      }else{
        state.settings.profile = {...(state.settings.profile||{}), email: cloudSession?.user?.email || f.email, role: ADMIN_EMAILS.includes(String(cloudSession?.user?.email || f.email).toLowerCase())?'admin':'user'}; state.settings.localMode=false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        startRealtimeSync();
        cloudLog('Login feito. Sincronização automática e ao vivo iniciadas.', 'success');
        notify('Login feito. Nuvem ativa.', 'success');
        setTimeout(()=>smartCloudSync(true), 700);
      }
      render();
    }catch(err){ console.error(err); notify('Falha no login/cadastro: '+(err.message||'confira os dados.'), 'warn'); }
  }
  async function testCloudConnection(){
    const client=getCloudClient();
    if(!client) return notify('Salve a configuração do Supabase primeiro.', 'warn');
    try{
      const {error}=await client.auth.getSession();
      if(error) throw error;
      const msg=cloudSession?.user?.email ? 'Conexão OK e usuário logado.' : 'Conexão OK. Local com e-mail e senha.'; cloudLog(msg,'success'); notify(msg, 'success');
    }catch(err){ console.error(err); notify('Não consegui conectar ao Supabase. Confira URL e chave publicável.', 'warn'); }
  }
  async function signInWithGoogle(){
    const client=getCloudClient();
    if(!client) return notify('Salve a configuração do Supabase primeiro.', 'warn');
    try{ await client.auth.signInWithOAuth({provider:'google', options:{redirectTo:location.origin+location.pathname}}); }
    catch(err){ console.error(err); notify('Google ainda não está ativo no Supabase. Use e-mail e senha por enquanto.', 'warn'); }
  }

  function bindGlobal(){
    document.addEventListener('click', (ev)=>{
      const viewBtn = ev.target.closest('[data-view]'); if(viewBtn){ ev.preventDefault(); setView(viewBtn.dataset.view); return; }

    });
    document.addEventListener('submit', (ev)=>{ ev.preventDefault(); handleSubmit(ev.target); });
    document.addEventListener('input', (ev)=>{ if(ev.target.matches('[data-money]')) applyMoneyMask(ev.target); if(ev.target.closest('#ifood-cash-form')) updateIfoodPreview(ev.target.closest('#ifood-cash-form')); });

e(el.dataset.id), scrollPatrimonioForm:()=>scrollPatrimonioForm(), toggleUiMode

  function handleSubmit(form){
    if(form.id==='patrimonio-form') return savePatrimonio(form);
    if(form.id==='futuro-patrimonio-form') return saveFuturoPatrimonio(form);
    if(form.id==='transaction-form') return saveTransaction(form);
    if(form.id==='edit-lancamento-form') return saveEditedLancamento(form);
    if(form.id==='edit-ifood-cash-form') return saveEditedIfoodCash(form);
    if(form.id==='deposit-form') return saveDeposit(form);

    if(form.id==='ifood-cash-form') return saveIfoodCash(form);
    if(form.id==='cartao-form') return saveCartao(form);
    if(form.id==='fuel-form') return saveFuel(form);
    if(form.id==='goal-form') return saveGoal(form);
    if(form.id==='source-form') return saveSource(form);

  }
  function applyMoneyMask(input){ const digits = String(input.value).replace(/\D/g,''); if(!digits){ input.value=''; input.dataset.value='0'; return; } const n = Number(digits)/100; input.dataset.value = String(n); input.value = n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function hydrateMoneyInputs(root=document){ $$('[data-money]', root).forEach(input=>{ if(input.value) applyMoneyMask(input); }); updateIfoodPreview($('#ifood-cash-form')); }

  function savePatrimonio(form){ const f=formObj(form); const ts=nowISO(); const existing=state.patrimonio.find(p=>p.data===f.data); const item=normalizePatrimonio({id:existing?.id||id('pat'), createdAt:existing?.createdAt||ts, updatedAt:ts, data:f.data, futuro:moneyField(form,'futuro'), giro:moneyField(form,'giro'), carteira:moneyField(form,'carteira'), banco:moneyField(form,'banco'), investimentos:moneyField(form,'investimentos'), faturaAberta:moneyField(form,'faturaAberta'), outrasDividas:moneyField(form,'outrasDividas'), rendimentoFuturo:moneyField(form,'rendimentoFuturo'), rendimentoGiro:moneyField(form,'rendimentoGiro'), observacoes:f.observacoes}); const idx=state.patrimonio.findIndex(p=>p.data===item.data); if(idx>=0){state.patrimonio[idx]=item;} else state.patrimonio.push(item); saveState(); feel('patrimonio','Patrimônio atualizado',`Futuro salvo: ${asMoney(item.futuro)}. A base do dia foi atualizada.`); setView('dashboard'); }
  function saveDeposit(form){ const f=formObj(form); const ts=nowISO(); const source=sourceName(f.sourceId); const item=normalizeLancamento({id:id('mov'), createdAt:ts, updatedAt:ts, data:f.data, tipo:'Entrada/aporte', valor:parseMoneyInput(form.valor), conta:f.conta, contaDestino:'', sourceId:f.sourceId, categoria:source||'Entrada', descricao:f.descricao || (source ? `${source} → ${f.conta}` : `Entrada → ${f.conta}`)}); if(item.valor<=0) return notify('Informe um valor maior que zero.', 'warn'); if(!item.conta) return notify('Escolha para onde o dinheiro foi.', 'warn'); state.lancamentos.push(item); saveState(); const e=estimatedBalances(); const k=accountKey(item.conta); const saldo=k && e.available ? e.est[k] : null; feel('good','Entrada registrada',`${source||'Entrada'} foi para ${item.conta}. ${saldo!==null?accountTitle(k)+' estimado agora: '+asMoney(saldo):'Isso explica a evolução do patrimônio.'}`); closeModal(); setView('entradas'); }
  function saveTransaction(form){ const f=formObj(form); const ts=nowISO(); const item=normalizeLancamento({id:id('mov'), createdAt:ts, updatedAt:ts, data:f.data, tipo:f.tipo, valor:parseMoneyInput(form.valor), conta:f.conta, contaDestino:f.contaDestino, sourceId:f.sourceId, categoria:f.sourceId?sourceName(f.sourceId):'', descricao:f.descricao}); if(item.valor<=0) return notify('Informe um valor maior que zero.', 'warn'); state.lancamentos.push(item); saveState(); const isOut=isExpenseType(item.tipo); feel(isOut?'warn':'good', isOut?'Saída registrada':'Entrada registrada', isOut?'Sem julgamento. Só um ponto para acompanhar no plano.':'Bom. Isso explica uma evolução no patrimônio.'); closeModal(); render(); }

        <button class="quick-card" data-action="quickPatrimonio"><span class="quick-ico">✅</span><b>Conferi meus saldos</b><span>Salvar patrimônio real do dia.</span></button><button class="quick-card" data-action="quickPatrimonioFuturo"><span class="quick-ico">🎯</span><b>Atualizar Futuro</b><span>Corrige só a Caixinha Futuro sem zerar outros saldos.</span></button>
        <button class="quick-card" data-action="openBalanceCoach"><span class="quick-ico">🧭</span><b>Não sei se bateu</b><span>Abra a conferência de saldos e rastros.</span></button>
      </div><div class="logic-note" style="margin-top:14px"><b>Regra do app:</b> entrada/aporte explica saldo; rendimento CDI fica separado; iFood dinheiro movimenta Carteira e Giro ao mesmo tempo.</div>`);
  }
  function openBalanceCoach(){
    const e=estimatedBalances(); const p=e.available?e.est:(latestPatrimonio()||{}); const changes=e.available?e.changes.length:0;
    openModal(`<div class="card-title"><div><h2>Conferência de saldos</h2><p>Use esta tela para pensar como usuário: onde está o dinheiro agora e qual rastro explica cada saldo?</p></div><span class="pill">${APP_VERSION}</span></div>
      <div class="grid grid-3">
        <button class="metric click-card wallet" data-action="openAccountTrail" data-account="carteira"><span class="metric-label">Espécie / Carteira</span><span class="metric-value sensitive">${privateMoney(p.carteira)}</span><span class="metric-small">Clique para ver iFood dinheiro, entradas e saídas.</span></button>
        <button class="metric click-card giro" data-action="openAccountTrail" data-account="giro"><span class="metric-label">Caixinha Giro</span><span class="metric-value sensitive">${privateMoney(p.giro)}</span><span class="metric-small">Clique para ver depósitos, trocos, saídas e CDI.</span></button>
        <button class="metric click-card futuro" data-action="openAccountTrail" data-account="futuro"><span class="metric-label">Caixinha Futuro</span><span class="metric-value sensitive">${privateMoney(p.futuro)}</span><span class="metric-small">Clique para ver aportes e rendimento.</span></button>
      </div>
      <div class="logic-note" style="margin-top:14px">Movimentos depois da última base: <b>${changes}</b>. Se os saldos estiverem iguais ao Nubank/carteira física, você pode confirmar como patrimônio de hoje.</div>
      <div class="kpi-strip" style="margin-top:14px"><button class="primary-btn" data-action="saveEstimatedAsPatrimonio">Confirmar como patrimônio de hoje</button><button class="ghost-btn" data-action="quickPatrimonio">Conferir manualmente</button><button class="ghost-btn" data-action="openGuidedEntry">Registrar algo</button></div>`);
  }

  function openFuturoPatrimonioModal(){
    const e=estimatedBalances();
    const base=e.available?e.est:(latestPatrimonio()||{});
    const latest=latestPatrimonio();
    openModal(`<div class="card-title"><div><h2>Atualizar Caixinha Futuro</h2><p>Use quando você quer lançar/conferir só o saldo do Futuro. O app preserva Giro, Carteira, Banco, fatura e demais saldos da base atual.</p></div><span class="pill green">Futuro</span></div><form class="form" id="futuro-patrimonio-form"><div class="logic-note"><b>Importante:</b> isso é patrimônio/base de saldo. Se foi dinheiro novo indo para o Futuro, use também “Entrada/aporte” para explicar que não foi rendimento CDI.</div><div class="form-grid"><div class="field"><label>Data</label><input type="date" name="data" value="${todayISO()}"></div><div class="field highlight-field"><label>Saldo real da Caixinha Futuro</label><input class="money-input" data-money name="futuro" inputmode="numeric" value="${moneyInputValue(base.futuro)}"><small>Ex.: 1106478 vira 11.064,78.</small></div><div class="field"><label>Rendimento Futuro do dia, se souber</label><input class="money-input" data-money name="rendimentoFuturo" inputmode="numeric" value="${moneyInputValue(0)}"><small>Opcional. Se deixar zero, o app tenta calcular pela diferença.</small></div><div class="field"><label>Última base usada</label><input readonly value="${latest?formatDate(latest.data):'Nenhuma base ainda'}"></div></div><div class="field"><label>Observação</label><input name="observacoes" value="Conferência da Caixinha Futuro"></div><div class="kpi-strip"><button class="primary-btn" type="submit">Salvar Futuro</button><button class="ghost-btn" data-action="quickPatrimonio">Patrimônio completo</button></div></form>`);
    hydrateMoneyInputs($('#modal'));
  }
  function saveFuturoPatrimonio(form){
    const f=formObj(form); const ts=nowISO(); const data=f.data||todayISO();
    const e=estimatedBalances(); const base=e.available?e.est:(latestPatrimonio()||{});
    const existing=state.patrimonio.find(p=>p.data===data);
    const origem=existing || base || {};
    const item=normalizePatrimonio({...origem, id:existing?.id||id('pat'), createdAt:existing?.createdAt||ts, updatedAt:ts, data, futuro:moneyField(form,'futuro'), rendimentoFuturo:moneyField(form,'rendimentoFuturo'), observacoes:f.observacoes || 'Conferência da Caixinha Futuro'});
    const idx=state.patrimonio.findIndex(p=>p.data===item.data);
    if(idx>=0) state.patrimonio[idx]=item; else state.patrimonio.push(item);
    saveState(); closeModal(); feel('good','Caixinha Futuro salva',`Futuro agora: ${asMoney(item.futuro)}. Os outros saldos foram preservados.`); setView('dashboard');
  }
  function openDepositModal(pref={}){ openModal(`<div class="card-title"><div><h2>Registrar entrada/deposito</h2><p>Informe a origem e escolha para onde o dinheiro foi. Isso atualiza o saldo estimado e impede conflito com rendimento CDI.</p></div><span class="pill green">Entrada → destino</span></div>${depositForm(pref)}`); }
  function openTransactionModal(pref={}){ openModal(`<div class="card-title"><div><h2>${pref.tipo && isExpenseType(pref.tipo) ? 'Registrar saída' : pref.tipo && isYieldType(pref.tipo) ? 'Registrar rendimento' : 'Registrar movimento'}</h2><p>O app usa esse registro para explicar a variação do patrimônio.</p></div></div>${transactionForm(pref)}`); }
  function openIfoodModal(){ openModal(`<div class="card-title"><div><h2>iFood dinheiro</h2><p>Cliente pagou em espécie; o dinheiro entra inteiro na Carteira e o troco sai do Giro.</p></div></div>${ifoodCashForm()}`); }
  function updateIfoodPreview(form){ if(!form) return; const received=parseMoneyInput(form.recebido); const change=parseMoneyInput(form.troco); const preview=form.querySelector('[data-preview="ifood-net"]'); if(preview) preview.value = moneyInputValue(received-change); }

  function editLancamentoForm(item){
    const sources=incomeSources().filter(s=>s.active!==false);
    return `<form class="form" id="edit-lancamento-form" data-id="${escapeHtml(item.id)}"><div class="logic-note"><b>Edição segura:</b> alterar um lançamento recalcula automaticamente Dashboard, Composição, Rendimentos e Nuvem. Use quando um Pix cair no dia seguinte, mas o faturamento pertence ao dia anterior.</div><div class="form-grid"><div class="field"><label>Data do lançamento</label><input type="date" name="data" value="${item.data||todayISO()}"></div><div class="field"><label>Tipo</label><select name="tipo"><option ${sel(item.tipo,'Entrada/aporte')}>Entrada/aporte</option><option ${sel(item.tipo,'Saída/despesa')}>Saída/despesa</option><option ${sel(item.tipo,'Rendimento')}>Rendimento</option><option ${sel(item.tipo,'Transferência')}>Transferência</option><option ${sel(item.tipo,'Pagamento fatura')}>Pagamento fatura</option></select></div><div class="field"><label>Valor corrigido</label><input class="money-input" data-money inputmode="numeric" name="valor" value="${moneyInputValue(item.valor)}"><small>Ex.: 6100 vira 61,00.</small></div><div class="field"><label>Conta afetada</label><select name="conta">${accountOptions(item.conta||'Giro')}</select></div><div class="field"><label>Conta destino, se for transferência</label><select name="contaDestino"><option value="">Não se aplica</option>${accountOptions(item.contaDestino||'')}</select></div><div class="field"><label>Origem/categoria</label><select name="sourceId"><option value="">Não se aplica</option>${sources.map(s=>`<option value="${s.id}" ${item.sourceId===s.id?'selected':''}>${escapeHtml((s.icon||'💰')+' '+s.name)}</option>`).join('')}</select></div></div><div class="field"><label>Descrição</label><input name="descricao" value="${escapeHtml(item.descricao||'')}" placeholder="Ex.: Entregas 03/07 ajustado com Pix recebido no dia seguinte"></div><div class="field"><label>Motivo da edição</label><input name="editReason" value="" placeholder="Ex.: R$ 10 pertence ao dia 03/07, mas caiu no dia 04/07"></div><div class="kpi-strip"><button class="primary-btn" type="submit">Salvar alteração</button><button class="ghost-btn" data-action="closeModal">Cancelar</button></div></form>`;
  }
  function openEditLancamentoModal(id){
    const item=(state.lancamentos||[]).find(x=>x.id===id);
    if(!item) return notify('Não encontrei esse lançamento para editar.', 'warn');
    openModal(`<div class="card-title"><div><h2>Editar lançamento</h2><p>Ajuste data, valor, origem ou destino sem duplicar registro. Ideal para entregas pagas no dia seguinte.</p></div><span class="pill">Histórico</span></div>${editLancamentoForm(item)}${editHistoryHtml(item)}`);
    hydrateMoneyInputs($('#modal'));
  }
  function editIfoodCashForm(item){
    return `<form class="form" id="edit-ifood-cash-form" data-id="${escapeHtml(item.id)}"><div class="logic-note"><b>iFood em espécie:</b> recebido entra inteiro na Carteira; troco sai do Giro. Ao editar, o app recalcula o saldo vivo dessas contas.</div><div class="form-grid"><div class="field"><label>Data</label><input type="date" name="data" value="${item.data||todayISO()}"></div><div class="field"><label>Valor recebido em espécie</label><input class="money-input" data-money name="recebido" inputmode="numeric" value="${moneyInputValue(item.recebido)}"></div><div class="field"><label>Troco que saiu do Giro</label><input class="money-input" data-money name="troco" inputmode="numeric" value="${moneyInputValue(item.troco)}"></div><div class="field"><label>Impacto líquido</label><input class="money-input" data-preview="ifood-net" readonly value="${moneyInputValue(item.liquido)}"></div></div><div class="field"><label>Observação</label><input name="observacoes" value="${escapeHtml(item.observacoes||'')}"></div><div class="field"><label>Motivo da edição</label><input name="editReason" placeholder="Ex.: corrigi troco ou valor recebido"></div><div class="kpi-strip"><button class="primary-btn" type="submit">Salvar alteração</button><button class="ghost-btn" data-action="closeModal">Cancelar</button></div></form>`;
  }
  function openEditIfoodCashModal(id){
    const item=(state.ifoodCash||[]).find(x=>x.id===id);
    if(!item) return notify('Não encontrei esse registro de iFood dinheiro.', 'warn');
    openModal(`<div class="card-title"><div><h2>Editar iFood dinheiro</h2><p>Corrige Carteira e Giro sem criar lançamento duplicado.</p></div><span class="pill">Acerto de caixa</span></div>${editIfoodCashForm(item)}${editHistoryHtml(item)}`);
    hydrateMoneyInputs($('#modal'));
  }
  function editHistoryHtml(item){
    const hist=Array.isArray(item.editHistory)?item.editHistory:[];
    return hist.length?`<div class="backup-zone"><h3>Histórico de edições</h3><div class="list compact">${hist.slice(-5).reverse().map(h=>`<div class="list-item"><div><strong>${new Date(h.at).toLocaleString('pt-BR')}</strong><span>${escapeHtml(h.reason||'Edição sem motivo informado')}</span></div><div class="list-amount">${h.fromValor!==undefined?asMoney(h.fromValor)+' → '+asMoney(h.toValor):''}</div></div>`).join('')}</div></div>`:'';
  }
  function saveEditedLancamento(form){
    const id=form.dataset.id; const idx=(state.lancamentos||[]).findIndex(x=>x.id===id);
    if(idx<0) return notify('Não encontrei esse lançamento para salvar.', 'warn');
    const prev=state.lancamentos[idx]; const f=formObj(form); const ts=nowISO();
    const next=normalizeLancamento({...prev, data:f.data, tipo:f.tipo, valor:parseMoneyInput(form.valor), conta:f.conta, contaDestino:f.contaDestino, sourceId:f.sourceId, categoria:f.sourceId?sourceName(f.sourceId):prev.categoria, descricao:f.descricao, updatedAt:ts, editedAt:ts, editReason:f.editReason||prev.editReason||'', editHistory:[...(prev.editHistory||[]), {at:ts, reason:f.editReason||'Edição manual', fromValor:safeNum(prev.valor), toValor:parseMoneyInput(form.valor), fromData:prev.data, toData:f.data, fromConta:prev.conta, toConta:f.conta}]});
    if(next.valor<=0) return notify('Informe um valor maior que zero.', 'warn');
    localStorage.setItem(`${STORAGE_KEY}-backup-antes-editar-${Date.now()}`, JSON.stringify(state));
    state.lancamentos[idx]=next; saveState(); const e=estimatedBalances();
    feel('good','Lançamento atualizado',`Histórico corrigido. Carteira estimada: ${asMoney(e.est?.carteira||0)}. A nuvem será atualizada automaticamente.`);
    closeModal(); setView('lancamentos');
  }
  function saveEditedIfoodCash(form){
    const id=form.dataset.id; const idx=(state.ifoodCash||[]).findIndex(x=>x.id===id);
    if(idx<0) return notify('Não encontrei esse acerto para salvar.', 'warn');
    const prev=state.ifoodCash[idx]; const f=formObj(form); const ts=nowISO(); const recebido=parseMoneyInput(form.recebido); const troco=parseMoneyInput(form.troco);
    const next=normalizeIfoodCash({...prev, data:f.data, recebido, troco, liquido:recebido-troco, observacoes:f.observacoes, updatedAt:ts, editedAt:ts, editReason:f.editReason||prev.editReason||'', editHistory:[...(prev.editHistory||[]), {at:ts, reason:f.editReason||'Edição manual', fromValor:safeNum(prev.liquido), toValor:recebido-troco, fromRecebido:safeNum(prev.recebido), toRecebido:recebido, fromTroco:safeNum(prev.troco), toTroco:troco}]});
    if(recebido<=0 && troco<=0) return notify('Informe recebido ou troco.', 'warn');
    localStorage.setItem(`${STORAGE_KEY}-backup-antes-editar-ifood-${Date.now()}`, JSON.stringify(state));
    state.ifoodCash[idx]=next; saveState(); const e=estimatedBalances();
    feel('good','iFood dinheiro atualizado',`Carteira e Giro recalculados. Carteira estimada: ${asMoney(e.est?.carteira||0)}.`);
    closeModal(); setView('ifood');
  }

  function undoLastMovement(){
    const candidates=[];
    (state.lancamentos||[]).forEach(x=>candidates.push({kind:'lancamentos', item:x, label:x.descricao||x.tipo||'lançamento', at:dateMs(x.createdAt||x.updatedAt||x.data)}));
    (state.ifoodCash||[]).forEach(x=>candidates.push({kind:'ifoodCash', item:x, label:'iFood dinheiro', at:dateMs(x.createdAt||x.updatedAt||x.data)}));
    (state.cartao||[]).forEach(x=>candidates.push({kind:'cartao', item:x, label:x.descricao||'compra no cartão', at:dateMs(x.createdAt||x.updatedAt||x.data)}));
    if(!candidates.length) return notify('Não encontrei movimento operacional para desfazer.', 'warn');
    candidates.sort((a,b)=>b.at-a.at);
    const last=candidates[0];
    const amount = last.kind==='ifoodCash' ? safeNum(last.item.recebido)-safeNum(last.item.troco) : safeNum(last.item.valor);
    if(!confirm(`Desfazer o último registro?\n\n${last.label}\nValor: ${asMoney(amount)}\n\nO app criará uma cópia local antes de remover.`)) return;
    try{ localStorage.setItem(`${STORAGE_KEY}-antes-desfazer-${Date.now()}`, JSON.stringify(state)); }catch(_){ }
    state[last.kind] = (state[last.kind]||[]).filter(x=>x.id !== last.item.id);
    saveState();
    feel('warn','Registro desfeito',`${last.label} foi removido. A nuvem será atualizada automaticamente.`);
    render();
  }
  function toggleBalances(){ state.settings.hideBalances = !state.settings.hideBalances; saveState(); render(); }
  function notify(msg,type='info'){ $('#alert-area').innerHTML = `<div class="alert ${type}"><span>${escapeHtml(msg)}</span><button class="icon-btn" data-action="dismissAlert">OK</button></div>`; setTimeout(()=>{ if($('#alert-area').textContent.includes(msg)) $('#alert-area').innerHTML=''; }, 3800); }
  function feel(tone,title,text){ try{ if(navigator.vibrate) navigator.vibrate(tone==='good'?[18,35,18]:tone==='warn'?[14]:[12,30,12]); }catch(_){ } const toast=$('#toast'); toast.className = `toast show ${tone==='warn'?'warn':''}`; toast.querySelector('strong').textContent=title; toast.querySelector('span').textContent=text; toast.querySelector('.toast-icon').textContent = tone==='warn'?'•':'✓'; clearTimeout(toast._t); toast._t=setTimeout(()=>toast.classList.remove('show'),2800); }

  function saveEstimatedAsPatrimonio(){
    const e=estimatedBalances();
    if(!e.available) return notify('Registre uma base de patrimônio primeiro.', 'warn');
    const ts=nowISO();
    const item=normalizePatrimonio({...e.est, id:id('pat'), data:todayISO(), createdAt:ts, updatedAt:ts, observacoes:'Patrimônio confirmado a partir dos saldos estimados pelo app.'});
    state.patrimonio.push(item);
    saveState();
    feel('good','Patrimônio confirmado',`Carteira ${asMoney(item.carteira)} e Giro ${asMoney(item.giro)} viraram a nova base de hoje.`);
    setView('dashboard');
  }
  function exportBackup(){ saveState(); state.settings.lastBackupAt = new Date().toISOString(); saveState(); const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), appVersion:APP_VERSION, storageKey:STORAGE_KEY, data:state}, null, 2)], {type:'application/json'}); download(blob, `backup-financeiro-crm-${todayISO()}-${APP_VERSION}.json`); }
  function exportCSV(){ const rows=[]; rows.push(['tipo','data','descricao','valor','detalhe'].join(';')); state.lancamentos.forEach(l=>rows.push(['lancamento',l.data,`"${(l.descricao||l.tipo).replace(/"/g,'""')}"`,l.valor,l.conta].join(';'))); state.ifoodCash.forEach(x=>rows.push(['ifood_dinheiro',x.data,'"iFood dinheiro"',x.liquido,`Carteira +${x.recebido} Giro -${x.troco}`].join(';'))); state.patrimonio.forEach(p=>rows.push(['patrimonio',p.data,'"Patrimônio líquido"',patrimonioLiquido(p),''].join(';'))); download(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}), `financeiro-crm-${todayISO()}.csv`); }
  function download(blob, filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
  function openImport(){ openModal(`<div class="card-title"><div><h2>Upload / importar backup</h2><p>Escolha o JSON exportado pelo app. O app cria uma cópia de segurança antes de substituir os dados atuais.</p></div></div><form class="form" id="import-form"><div class="field"><label>Arquivo</label><input type="file" name="file" accept="application/json,.json"></div><button class="primary-btn" type="submit">Importar</button></form>`); }
  async function importBackup(form){ try{ const file=form.file.files[0]; if(!file) return notify('Escolha um arquivo JSON.', 'warn'); const text=await file.text(); const parsed=JSON.parse(text); localStorage.setItem(`${STORAGE_KEY}-backup-antes-importar-${Date.now()}`, JSON.stringify(state)); state = migrateState(parsed.data || parsed); saveState(); closeModal(); feel('good','Backup importado','Seus registros foram restaurados neste aparelho.'); render(); }catch(err){ console.error(err); notify('Não consegui importar este arquivo. Confira se é o backup JSON do app.', 'warn'); } }
  function copySummary(){ const s=stats(); const e=s.explanation; const lines=['Resumo Financeiro CRM',`Data: ${formatDate(todayISO())}`,`Patrimônio líquido: ${asMoney(s.liquido)}`,`Bruto: ${asMoney(s.bruto)}`,`Falta para ${s.goal.name}: ${asMoney(s.goalInfo.falta)}`,`Entradas mês: ${asMoney(s.receitas+s.ifoodCashNet)}`,`Saídas mês: ${asMoney(s.saidas)}`, e?`Diferença sem explicação: ${asMoney(e.unexplained)}`:'Diferença: precisa de dois registros de patrimônio']; navigator.clipboard?.writeText(lines.join('\n')).then(()=>notify('Resumo copiado.', 'success')).catch(()=>openModal(`<pre>${escapeHtml(lines.join('\n'))}</pre>`)); }
  function resetApp(){ if(!confirm('Zerar todos os dados deste aparelho? Baixe backup antes.')) return; localStorage.setItem(`${STORAGE_KEY}-backup-antes-zerar-${Date.now()}`, JSON.stringify(state)); state = defaultState(); saveState(); render(); }
  async function hardRefresh(){ try{ if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); } if(window.caches){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); } }catch(_){ } location.reload(); }

  async function checkVersion(){
    try{ const r=await fetch(`version.json?ts=${Date.now()}`,{cache:'no-store'}); if(!r.ok) return; const data=await r.json(); const v=String(data.version||''); if(v && compareVersions(v, APP_VERSION)>0){ $('#update-text').textContent = `Financeiro CRM ${v} está no servidor. Seus registros continuam no aparelho.`; $('#update-banner').classList.add('show'); } }
    catch(_){ }
  }
  function compareVersions(a,b){ const pa=String(a).replace(/^v/,'').split('.').map(Number); const pb=String(b).replace(/^v/,'').split('.').map(Number); for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0,y=pb[i]||0; if(x>y) return 1; if(x<y) return -1; } return 0; }
  function registerSW(){ if(!('serviceWorker' in navigator)) return; window.addEventListener('load',()=>{ navigator.serviceWorker.register('service-worker.js?v=1209').then(reg=>{ reg.update(); if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); } reg.addEventListener('updatefound',()=>{ const sw=reg.installing; if(!sw) return; sw.addEventListener('statechange',()=>{ if(sw.state==='installed' && navigator.serviceWorker.controller){ $('#update-text').textContent='Nova versão baixada. Toque em Carregar para abrir sem precisar usar ?v=.'; $('#update-banner').classList.add('show'); } }); }); }).catch(()=>{}); }); navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!window.__reloadedBySW){ window.__reloadedBySW=true; location.reload(); } }); }

  init();
})();
</script>
</body>
</html>
